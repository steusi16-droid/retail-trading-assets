          for it in inputs:
              path=Path('assets')/it['path']
              path.parent.mkdir(parents=True,exist_ok=True)
              req=urllib.request.Request(it['url'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=40) as r: body=r.read()
              if 'sha256' in it:
                  got=hashlib.sha256(body).hexdigest()
                  if got!=it['sha256']: raise RuntimeError(f"Source SHA mismatch {path}: {got} != {it['sha256']}")
              path.write_bytes(body)
              print('FETCH',path,len(body),flush=True)
          import cairosvg
          for p in sorted(Path('assets/icons').glob('*.svg')):
              cairosvg.svg2png(bytestring=p.read_bytes(),write_to=str(p.with_suffix('.png')),output_width=512,output_height=512)
              print('PNG',p.with_suffix('.png'),flush=True)
          print('Assets complete')
          PY
      - name: Commit approved assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          git commit -m "Publish RTBA approved covers and icon PNG assets"
          git push
